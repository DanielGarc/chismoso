# Flatpak build of Chismoso, from source, with no network during the build.
#
#   sh flatpak/build.sh            build and install for this user (needs flatpak-builder)
#   flatpak run org.caprichosos.chismoso
#
# This copy builds the working tree (type: dir). The Flathub copy is made by
# flatpak/make-flathub.sh, which points the source at a release tag instead.
# cargo-sources.json (every crate from Cargo.lock) is generated, not committed.
app-id: org.caprichosos.chismoso
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: chismoso
finish-args:
  - --share=network        # talk to the Frigate server
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri           # hardware video decoding and rendering
  - --talk-name=org.freedesktop.Notifications   # alert notifications
  - --filesystem=xdg-videos # clips and timelapses are saved under Videos
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/chismoso/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: chismoso
    buildsystem: simple
    build-commands:
      # The UI is plain files, embedded by the build; no Node needed.
      - cargo --offline build --release --locked --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/chismoso -t /app/bin/
      - install -Dm644 flatpak/org.caprichosos.chismoso.desktop -t /app/share/applications/
      - install -Dm644 flatpak/org.caprichosos.chismoso.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 design/icon.svg /app/share/icons/hicolor/scalable/apps/org.caprichosos.chismoso.svg
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.caprichosos.chismoso.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/org.caprichosos.chismoso.png
      - install -Dm644 LICENSE -t /app/share/licenses/org.caprichosos.chismoso/
    sources:
      - type: dir
        path: ..
        skip:
          - src-tauri/target
          - site/node_modules
          - site/dist
          - .flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
      - cargo-sources.json
