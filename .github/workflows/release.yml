# Builds and publishes a release for Windows, macOS (Apple Silicon + Intel)
# and Linux, with a signed latest.json that installed copies use to update
# themselves.
#
# Ways to start it:
#   - Actions → "Bump version and release" (recommended: sets the version,
#     tags, then calls this workflow), or
#   - push a tag like v0.2.0 whose version matches src-tauri/Cargo.toml.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           updater signing key (required)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if none)
# Code signing (optional, later): Windows and Apple certificates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # One draft release that every build uploads into; it's published only
  # after all of them succeed, so latest.json never points at missing files.
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Check the tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$TAG" ] || { echo "::error::Tag $TAG but Cargo.toml says $v"; exit 1; }
      # "What's new": the app-facing commits since the previous release.
      # Website, CI, docs and version-bump commits are left out. The app shows
      # these lines in its update bar (via latest.json).
      - id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
          lines=$(git log "$range" --no-merges --format='- %s' \
            | grep -viE '^- (release|website|site|ci|docs?|readme|launch)\b|website|readme|promo' || true)
          [ -n "$lines" ] || lines="- Small fixes and improvements."
          { echo 'notes<<CHISMOSO_EOF'; echo "$lines"; echo 'CHISMOSO_EOF'; } >> "$GITHUB_OUTPUT"
      - id: create
        uses: actions/github-script@v7
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            const body = `## What's new\n\n${process.env.NOTES}\n\n` +
              `**Download:** https://chismoso.caprichosos.org/download.html\n\n` +
              `The installers aren't code-signed yet: on Windows choose *More info → Run anyway*; ` +
              `on macOS right-click the app and choose *Open* the first time. ` +
              `Installed copies offer this update on their own.`;
            const existing = (await github.rest.repos.listReleases({ owner, repo, per_page: 50 })).data.find(r => r.tag_name === tag);
            const rel = existing ?? (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `Chismoso ${tag.replace(/^v/, '')}`, draft: true, body,
            })).data;
            core.setOutput('id', rel.id);

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          releaseId: ${{ needs.draft.outputs.id }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: ${{ needs.draft.outputs.id }}, draft: false, make_latest: 'true',
            });
