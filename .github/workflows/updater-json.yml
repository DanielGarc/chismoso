# Writes the release's latest.json (what installed copies read to update)
# from the signed files already attached to it. Run by release.yml after every
# build has uploaded, so parallel builds can't overwrite each other's entries.
# Can also be run by hand (Actions → "Updater manifest") to repair a release,
# optionally replacing its "What's new" text.
name: Updater manifest

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.1)
        required: true
        type: string
      notes:
        description: Optional new "What's new" text (one change per line)
        required: false
        type: string

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const rel = (await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 }))
              .find(r => r.tag_name === tag);
            if (!rel) throw new Error(`No release for ${tag}`);

            // Optional: replace the "What's new" list in the release body.
            let body = rel.body || '';
            const fresh = (process.env.NOTES || '').split(/\r?\n|\\n/).map(l => l.trim()).filter(Boolean)
              .map(l => (l.startsWith('- ') ? l : `- ${l}`)).join('\n');
            if (fresh) {
              body = body.match(/## What's new/)
                ? body.replace(/## What's new\n\n[\s\S]*?(\n\n\*\*Download|$)/, `## What's new\n\n${fresh}$1`)
                : `## What's new\n\n${fresh}\n\n${body}`;
              await github.rest.repos.updateRelease({ owner, repo, release_id: rel.id, body });
            }
            const notes = (body.match(/## What's new\n\n([\s\S]*?)(?:\n\n\*\*Download|$)/) || [, ''])[1].trim();

            // Updater keys by file name. The plain "{os}-{arch}" key is the
            // fallback for copies that can't tell how they were installed.
            const rules = [
              [/_x64-setup\.exe$/, ['windows-x86_64-nsis', 'windows-x86_64']],
              [/_x64_en-US\.msi$/, ['windows-x86_64-msi']],
              [/_amd64\.AppImage$/, ['linux-x86_64-appimage', 'linux-x86_64']],
              [/_amd64\.deb$/, ['linux-x86_64-deb']],
              [/\.x86_64\.rpm$/, ['linux-x86_64-rpm']],
              [/_aarch64\.AppImage$/, ['linux-aarch64-appimage', 'linux-aarch64']],
              [/_arm64\.deb$/, ['linux-aarch64-deb']],
              [/\.aarch64\.rpm$/, ['linux-aarch64-rpm']],
              [/_aarch64\.app\.tar\.gz$/, ['darwin-aarch64-app', 'darwin-aarch64']],
              [/_x64\.app\.tar\.gz$/, ['darwin-x86_64-app', 'darwin-x86_64']],
            ];
            const assets = rel.assets;
            const platforms = {};
            for (const a of assets) {
              const rule = rules.find(([re]) => re.test(a.name));
              if (!rule) continue;
              const sig = assets.find(s => s.name === `${a.name}.sig`);
              if (!sig) { core.warning(`${a.name} has no .sig; skipped`); continue; }
              const { data } = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: sig.id, headers: { accept: 'application/octet-stream' },
              });
              const signature = Buffer.from(data).toString('utf8').trim();
              const url = `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(a.name)}`;
              for (const key of rule[1]) platforms[key] = { signature, url };
            }
            const required = ['windows-x86_64', 'linux-x86_64', 'darwin-aarch64', 'darwin-x86_64'];
            const missing = required.filter(k => !platforms[k]);
            if (missing.length) throw new Error(`Missing signed builds for: ${missing.join(', ')}`);

            const manifest = { version: tag.replace(/^v/, ''), notes, pub_date: new Date().toISOString(), platforms };
            const old = assets.find(a => a.name === 'latest.json');
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: rel.id, name: 'latest.json',
              data: JSON.stringify(manifest, null, 2), headers: { 'content-type': 'application/json' },
            });
            core.info(`latest.json: ${Object.keys(platforms).sort().join(', ')}`);
