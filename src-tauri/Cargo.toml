[package]
name = "chismoso"
version = "0.3.2"
description = "Lightweight client for Frigate NVR: live view, recordings, timelapses, alerts"
edition = "2024"
license = "MIT"

# Desktop builds the `chismoso` binary (src/main.rs); Android and iOS
# load the library (src/lib.rs, `run`) from their native shells.
[lib]
name = "chismoso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
chrono = "0.4"
dirs = "7"
anyhow = "1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tiny_http = "0.12.0"
getrandom = "0.4.3"
sha2 = "0.11.0"

# ── per platform ── keep platform-only crates here, and their code in src/platform/.
# TLS uses ring everywhere (pure Rust + small C): cross-compiles to Android/iOS
# without CMake, unlike aws-lc.

# Desktop (and iOS): check certificates with the OS's own store.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.7"

# Android: the OS store needs a Java bridge; use Mozilla's root list instead.
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "4.18"
# Self-update from signed GitHub releases (desktop; phones update through stores).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
# Windows toasts: registered with the app's own identity (name + icon), not PowerShell's.
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[features]
# Serve the bundled ui/ folder (no dev server needed), so plain `cargo run` works.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
